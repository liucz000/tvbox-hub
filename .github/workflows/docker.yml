name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull "ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}"

      - name: Run container
        run: |
          docker run -d --name tvbox-hub-smoke -p 5678:5678 \
            -e ADMIN_PASSWORD=smoke-test-pass \
            "ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}"

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs tvbox-hub-smoke
          exit 1

      - name: Check password login
        run: |
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -c /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"password":"smoke-test-pass"}' \
            http://127.0.0.1:5678/admin/login)
          echo "login status=$code body=$(cat /tmp/login.json)"
          test "$code" = "200"
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:5678/admin/sources | head -c 300
          echo

      - name: Container logs
        if: always()
        run: docker logs tvbox-hub-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f tvbox-hub-smoke || true
